name: Release binaries
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.1)
        required: true
        type: string
      source_ref:
        description: Optional source ref for rebuilding a tag with a verified fix
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_ref:
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  # The web bundle reads this through Varlock; releases talk to the loopback daemon.
  PUBLIC_SERVER_URL: http://127.0.0.1:4317
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-x64, native: true }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64, native: true }
          - { runner: macos-15, platform: darwin-arm64, native: true }
          - { runner: macos-15-intel, platform: darwin-x64, native: true }
          # Cross-built by bun on the Linux runner (no Windows runner needed);
          # native=false skips the smoke steps that must execute the binary.
          - { runner: ubuntu-24.04, platform: windows-x64, native: false }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Validate version
        run: |
          if [ -n "${{ inputs.source_ref }}" ]; then
            LOOM_VERSION="${RELEASE_TAG#v}" bun -e 'const expected = process.env.LOOM_VERSION; const actual = (await Bun.file("version.json").json()).version; if (actual !== expected) throw new Error(`Source version ${actual} does not match release ${expected}`); console.log(`Validated rebuild of v${expected}`);'
          else
            bun scripts/validate-release.ts
          fi
      - run: bun install --frozen-lockfile
      - run: bun scripts/test.ts
      - run: bun run --cwd apps/cli check-types
      - run: bun run --cwd apps/web check
      - run: bun run --cwd apps/web build
      - run: bun scripts/build-release.ts ${{ matrix.platform }}
      - name: Verify macOS arm64 executable signature
        if: matrix.platform == 'darwin-arm64'
        run: |
          bun --version
          sw_vers
          codesign --verify --strict --verbose=4 dist/loom-darwin-arm64
          cp dist/loom-darwin-arm64 "$RUNNER_TEMP/loom-darwin-arm64-copy"
          chmod 700 "$RUNNER_TEMP/loom-darwin-arm64-copy"
          codesign --verify --strict --verbose=4 "$RUNNER_TEMP/loom-darwin-arm64-copy"
          "$RUNNER_TEMP/loom-darwin-arm64-copy" --version
      - name: Check the target executable starts
        if: matrix.native
        run: |
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            ./dist/loom-windows-x64.exe --version
          else
            chmod +x dist/loom-${{ matrix.platform }}
            ./dist/loom-${{ matrix.platform }} --version
          fi
      - name: Start the packaged daemon
        if: matrix.native
        run: bun scripts/smoke-release.ts
      - name: Exercise the updater contract
        if: matrix.native
        run: bun scripts/smoke-update.ts
      - run: bun scripts/test-installer.ts
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: dist/loom-*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - run: LOOM_VERSION="${RELEASE_TAG#v}" bun scripts/release-manifest.ts
      - run: bun scripts/publish-release.ts
