name: Release binaries
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.0)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  # The web bundle reads this through Varlock; releases talk to the loopback daemon.
  PUBLIC_SERVER_URL: http://127.0.0.1:4317
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-x64, native: true }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64, native: true }
          # Apple silicon is cross-compiled: this account is only given Intel
          # macOS runners, and Bun fetches the matching runtime for the target.
          - { runner: macos-15-intel, platform: darwin-x64, native: true }
          - { runner: macos-15-intel, platform: darwin-arm64, native: false }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Validate version
        run: bun scripts/validate-release.ts
      - run: bun install --frozen-lockfile
      - run: bun scripts/test.ts
      - run: bun run --cwd apps/cli check-types
      - run: bun run --cwd apps/web check
      - run: bun run --cwd apps/web build
      - run: bun scripts/build-release.ts ${{ matrix.platform }}
      - name: Start the packaged daemon
        if: matrix.native
        run: bun scripts/smoke-release.ts
      - name: Exercise the updater contract
        if: matrix.native
        run: bun scripts/smoke-update.ts
      - run: bun scripts/test-installer.ts
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: dist/loom-*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - run: bun scripts/release-manifest.ts
      - run: bun scripts/publish-release.ts
