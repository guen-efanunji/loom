name: Runner probe
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15, macos-15-intel, macos-13, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 3
    steps:
      - name: Report the machine
        run: |
          echo "runner=${{ matrix.runner }}"
          uname -s -m || ver
          bun --version 2>NUL || echo "no bun"
        shell: bash
